---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: psql-0
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: flux-demo
  storageNamespace: flux-demo
  chart:
    spec:
      version: 12.1.15
  values:
    auth:
      username: admin
      password: admin123
    primary:
      resources:
        requests:
          cpu: 250m
          memory: 250Mi
        limits:
          cpu: 250m
          memory: 250Mi
      persistence:
        enabled: false
    fullnameOverride: psql-0