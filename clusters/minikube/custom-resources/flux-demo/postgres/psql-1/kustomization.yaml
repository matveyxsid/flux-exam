---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../../components/apps/postgresql
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
  - patch: |
      - op: replace
        path: /metadata/name
        value: psql-1
      - op: replace
        path: /spec/releaseName
        value: psql-1
      - op: add
        path: /spec/values/fullnameOverride
        value: psql-1
    target:
      kind: HelmRelease
      name: psql-1