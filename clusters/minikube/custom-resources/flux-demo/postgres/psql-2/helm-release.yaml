---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: flux-demo
  values:
    repository: bitnamilegacy/postgresql
    tag: 17.6.0
    auth:
      username: admin
      password: admin123
    primary:
      resources:
        requests:
          cpu: 250m
          memory: 250Mi
        limits:
          cpu: 250m
          memory: 250Mi
      persistence:
        enabled: false
