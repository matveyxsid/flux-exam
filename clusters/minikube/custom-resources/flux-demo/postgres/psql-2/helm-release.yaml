---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: psql-2
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: flux-demo
  chart:
    spec:
      chart: postgresql
      version: "18.3.0"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    auth:
      username: admin
      password: admin123
    primary:
      resources:
        requests:
          cpu: 250m
          memory: 250Mi
        limits:
          cpu: 250m
          memory: 250Mi
      persistence:
        enabled: false
