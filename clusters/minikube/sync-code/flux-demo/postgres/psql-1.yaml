---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: psql-1
  namespace: flux-system
spec:
  patches:
  - patch: |
      - op: replace
        path: /metadata/name
        value: psql-1
      - op: replace
        path: /spec/releaseName
        value: psql-1
    target:
      kind: HelmRelease
      name: postgresql
  interval: 5m
  prune: false
  wait: true
  path: ./clusters/minikube/custom-resources/flux-demo/postgres/psql-1
  sourceRef:
    kind: GitRepository
    name: flux-system