---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: psql-0
  namespace: flux-system
spec:
  patches:
  - patch: |

      - op: replace
        path: /metadata/name
        value: psql-0
      - op: replace
        path: /spec/releaseName
        value: psql-0
    target:
      kind: HelmRelease
      name: postgresql
  interval: 5m
  # dependsOn:
  #   - name: repos
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/minikube/custom-resources/flux-demo/postgres/psql-0
  prune: false
  wait: true
  timeout: 20m
  retryInterval: 5m
  # postBuild:
  #   substituteFrom:
  #     - kind: ConfigMap
  #       name: cluster-variables
  #       # Use this ConfigMap if it exists, but proceed if it doesn't.
  #       optional: false
  #   substitute:
  #     PSQL_NAME: <PSQL_POSTFIX>