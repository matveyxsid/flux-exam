---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx
  namespace: flux-system
spec:
  interval: 5m
  releaseName: nginx
  targetNamespace: <NAMESPACE>
  chart:
    spec:
      chart: nginx
      version: "22.6.0"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
