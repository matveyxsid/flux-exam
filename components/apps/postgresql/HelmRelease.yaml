---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: flux-system
spec:
  interval: 5m
  releaseName: postgresql
  targetNamespace: <NAMESPACE>
  chart:
    spec:
      chart: postgresql
      version: "18.3.0"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
